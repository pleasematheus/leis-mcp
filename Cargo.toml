[package]
name = "leis-mcp"
version = "1.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/pleasematheus/leis-mcp"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
flate2 = "1"
fs2 = "0.4"
indicatif = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rmcp = { version = "3.6", features = ["server", "transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }

