name: CI e distribuicao

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Formato, versao e analise
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Instalar Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Conferir versao e tag
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python scripts/release.py check-version
      - name: Conferir formato
        run: cargo +stable fmt -- --check
      - name: Analisar Rust
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Testar empacotamento
        run: python -m unittest discover -s scripts -p "test_*.py" -v

  build:
    name: Testar e empacotar (${{ matrix.target }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Instalar Rust stable e target
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: Executar testes Rust
        run: cargo +stable test --locked --target ${{ matrix.target }}
      - name: Testar empacotamento
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Compilar distribuicao
        run: cargo +stable build --release --locked --target ${{ matrix.target }}
      - name: Empacotar executavel e instrucoes
        run: python scripts/release.py package --target ${{ matrix.target }}
      - name: Testar executavel extraido do pacote
        run: python scripts/release.py smoke --target ${{ matrix.target }}
      - name: Salvar pacote da plataforma
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publicar GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [quality, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Conferir versao e integridade dos quatro pacotes
        run: |
          python scripts/release.py check-version
          python scripts/release.py checksums
      - name: Publicar pacotes apos todas as verificacoes
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$existing" == "false" ]]; then
            echo "::error::A versao ja foi publicada. Use uma nova versao para distribuir outros binarios."
            exit 1
          fi
          flags=()
          version_without_build="${RELEASE_TAG%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if [[ -z "$existing" ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG" "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
